[package]
name = "chronoscope"
version = "0.1.0"
edition = "2021"
description = "DFIR triage collector — pulls forensic artifacts from a live host and builds a unified timeline."
license = "AGPL-3.0-or-later"
authors = ["platinum2high"]
repository = "https://github.com/platinum2high/chronoscope"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
csv = "1"
walkdir = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
